<!doctype html>
<html lang="da">
<head>

  <title>Dagen Forklaret — nyheder på let dansk</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182c3c; background: #f7f3ec; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 640px); padding: clamp(28px, 7vw, 64px); border: 1px solid #ded7cb; border-radius: 20px; background: #fffdf8; }
    .label { display: inline-block; margin: 0 0 28px; padding: 7px 12px; border-radius: 100px; background: #f5ded5; font-size: 14px; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 8vw, 60px); line-height: 1.05; letter-spacing: -0.04em; }
    .tagline { margin: 0 0 36px; font-size: 22px; }
    .message { margin: 0; color: #4d5a61; line-height: 1.7; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #ded7cb; color: #647077; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="label">Podcasten er på vej</p>
    <h1>Dagen Forklaret</h1>
    <p class="tagline">Nyheder på let dansk.</p>
    <p class="message">Hjemmesiden er klar. Snart finder du nyheder fra Danmark, som du kan lytte til og læse med på.</p>
    <footer>dagenforklaret.dk · Testside</footer>
  </main>
